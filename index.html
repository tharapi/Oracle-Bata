<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#0f0c29">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>ดูดวงไพ่โอราเคิล</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100dvh; 
            overflow-x: hidden;
        }
        .card-container { perspective: 1000px; }
        @keyframes drawCardAnim {
            0% { transform: translateY(30px) scale(0.9); opacity: 0; }
            50% { transform: translateY(-5px) scale(1.02); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .card-reveal { animation: drawCardAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .card-back-pattern {
            background-color: #1e1b4b;
            background-image: radial-gradient(circle at center, #312e81 0%, #1e1b4b 100%);
            border: 2px solid #6366f1;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        .card-back-pattern:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
        }
        .whitespace-pre-line { white-space: pre-line; }
    </style>
</head>
<body class="flex flex-col items-center justify-between py-6 px-4">

    <header class="text-center w-full shrink-0">
        <h1 class="text-2xl md:text-3xl font-semibold mb-1 text-indigo-300 drop-shadow-md">✨ ดูดวงไพ่โอราเคิล ✨</h1>
        <p class="text-gray-300 text-xs md:text-sm">ตั้งสมาธิ อธิษฐาน แล้วแตะเพื่อสุ่มไพ่</p>
    </header>

    <main class="flex-grow flex flex-col justify-center items-center w-full max-w-sm py-4">
        <div id="result-area" class="hidden flex-col items-center w-full card-container h-full justify-center">
            <div id="card-display" class="w-48 h-[280px] sm:w-56 sm:h-[320px] rounded-2xl overflow-hidden shadow-2xl shadow-indigo-900/60 mb-4 bg-gray-800 border-[3px] border-indigo-400 shrink-0">
                <img id="card-image" src="" alt="ไพ่" class="w-full h-full object-cover" 
                     onerror="this.onerror=null; this.src='https://placehold.co/300x450/1e1b4b/e0e7ff?text=Image+Not+Found&font=prompt';">
            </div>
            <div id="card-info" class="text-center bg-gray-900/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl border border-gray-700 w-full shadow-lg">
                <h2 id="card-title" class="text-xl sm:text-2xl font-medium text-indigo-300 mb-2">ชื่อไพ่</h2>
                <p id="card-meaning" class="text-gray-200 leading-relaxed whitespace-pre-line text-sm sm:text-base">ความหมาย...</p>
            </div>
        </div>

        <div id="start-area" class="flex flex-col items-center justify-center h-full">
            <button id="main-draw-btn" onclick="drawRandomCard()" class="relative w-40 h-60 sm:w-48 sm:h-72 rounded-2xl card-back-pattern flex flex-col items-center justify-center transition-all focus:outline-none">
                <div class="text-indigo-300 mb-3 animate-pulse">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </div>
                <span class="font-medium tracking-wider text-lg">แตะเพื่อสุ่มไพ่</span>
            </button>
        </div>
    </main>

    <footer class="w-full shrink-0 flex flex-col items-center gap-3 pb-2">
        <button id="next-draw-btn" onclick="drawRandomCard()" class="hidden w-full max-w-[250px] py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 rounded-xl text-white font-medium shadow-lg transition-colors focus:outline-none text-base">
            ✨ สุ่มไพ่ใบต่อไป ✨
        </button>

        <div class="flex items-center justify-between w-full max-w-[250px] text-xs sm:text-sm">
            <p class="text-gray-400">เหลือ: <span id="cards-remaining" class="text-indigo-300 font-bold text-base">36</span> ใบ</p>
            <button onclick="resetDeck()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 active:bg-gray-700 rounded-full font-medium transition-colors border border-gray-600 text-gray-300 focus:outline-none">
                ↺ เริ่มใหม่
            </button>
        </div>
    </footer>

    <script>
        const TOTAL_CARDS = 36;
        let allCardsData = [];
        let availableDeck = [];

        function initializeDeck() {
            allCardsData = [
                { id: 1, imageUrl: '1.png', title: '1. พระสงฆ์ (The Monk)', meaning: 'การปล่อยวาง (Letting Go)\nความสงบ, สติ, การไม่ยึดติด' },
                { id: 2, imageUrl: '2.png', title: '2. ไอ้แดง (Red Ranger)', meaning: 'ความเป็นผู้นำ (Leadership)\nการปกป้อง, ความรับผิดชอบ, หัวขบวน' },
                { id: 3, imageUrl: '3.png', title: '3. สายรุ้ง (Rainbow)', meaning: 'ความคิดสร้างสรรค์ (Creativity)\nความหลากหลาย, การกล้าแตกต่าง, การปฏิวัติสิ่งเดิม' },
                { id: 4, imageUrl: '4.png', title: '4. นายจัน (Nai Chan)', meaning: 'การยืนหยัด (Resilience)\nความเด็ดเดี่ยว, ความกล้าหาญ, การปกป้องจุดยืน' },
                { id: 5, imageUrl: '4.png', title: '5. ราชา (The King)', meaning: 'ความมั่นใจ (Confidence)\nความโดดเด่น, การกล้าแสดงออก, อัตตา' },
                { id: 6, imageUrl: '6.png', title: '6. เทพสามตา (God)', meaning: 'ญาณหยั่งรู้ (Intuition)\nความศรัทธา, วิสัยทัศน์, ปัญญา' },
                { id: 7, imageUrl: '7.png', title: '7. น้องความทุกข์ (Sorrow)', meaning: 'ด้านมืดในใจ (The Shadow)\nการเผชิญหน้า, บททดสอบ, การยอมรับความจริง' },
                { id: 8, imageUrl: '8.png', title: '8. เพื่อนตาย (Best Friend)', meaning: 'มิตรภาพ (Companionship)\nการสนับสนุน, พันธมิตร, ความภักดี' },
                { id: 9, imageUrl: '9.png', title: '9. แม่เหล็ก (The Magnet)', meaning: 'แม่เหล็ก (The Magnet)\nพรหมลิขิต, จังหวะที่ใช่, ความเชื่อมโยง' },
                { id: 10, imageUrl: '10.png', title: '10. กำแพงใจ (The Wall)', meaning: 'กำแพงใจ (The Wall)\nความขัดแย้ง, ทิฐิ, การหันหลังให้กัน' }
                { id: 11, imageUrl: '11.png', title: '11. พลูโต (Pluto)', meaning: 'ระยะห่าง (Space)\nการแยกย้าย, การพักทบทวน, กาลเวลา' },
                { id: 12, imageUrl: '12.png', title: '12. ปกป้อง (Protect)', meaning: 'พื้นที่ปลอดภัย (Safe Haven)\nการปกป้อง, ความอบอุ่น, ความอุ่นใจ' },
                { id: 13, imageUrl: '13.png', title: '13. ครอบครัว (The Family)', meaning: 'รากฐาน (Foundation)\nครอบครัว, ความปลอดภัย, พรแห่งชีวิต' },
                { id: 14, imageUrl: '14.png', title: '14. ต้นไม้ (The Tree Man)', meaning: 'การเติบโต (Growth)\nการบ่มเพาะ, ความอดทน, กาลเวลา' },
                { id: 15, imageUrl: '15.png', title: '15. โจรสลัด (The Pirate)', meaning: 'อิสระเสรี (Freedom)\nการผจญภัย, การทำตามใจ, นอกกรอบ' },
                { id: 16, imageUrl: '16.png', title: '16. บัณฑิต (The Scholar)', meaning: 'ความสำเร็จ (Achievement)\nกัลยาณมิตร, ปัญญา, สังคมที่ดี' },
                { id: 17, imageUrl: '17.png', title: '17. เงือก (The Merfolk)', meaning: 'ความเท่าเทียม (Equality)\nการยอมรับ, ความยุติธรรม, การทลายอคติ' },
                { id: 18, imageUrl: '18.png', title: '18. โรบินฮู้ด (Robin Hood)', meaning: 'ความแม่นยำ (Focus)\nผู้ช่วยเหลือ, ไหวพริบ, การแบ่งปัน' },
                { id: 19, imageUrl: '19.png', title: '19. สปีด (Speed)', meaning: 'ไหวพริบ (Agility)\nจังหวะเวลา, ความรวดเร็ว, โอกาสเฉียบพลัน' },
                { id: 20, imageUrl: '20.png', title: '20. มืด (Blind)', meaning: 'ความหวาดระแวง (Paranoia)\nความไม่รู้, ความคลุมเครือ, ความสับสน' },
                { id: 21, imageUrl: '21.png', title: '21. ลัง (The Box)', meaning: 'ร่องรอยบาดแผล (Scars)\nอดีตฝังใจ, ความทรงจำ, รอยแผลชีวิต' },
                { id: 22, imageUrl: '22.png', title: '22. จอยบอย (Controller)', meaning: 'การควบคุม (Control)\nทางเลือก, เกมชีวิต, ความเรียบง่าย' },
                { id: 23, imageUrl: '23.png', title: '23. อมยิ้ม (The Lollipop)', meaning: 'ความไร้เดียงสา (Innocence)\nความสุขเล็กๆ, วัยเยาว์, การมองโลกแง่ดี' },
                { id: 24, imageUrl: '24.png', title: '24. มิจ (The Scammer)', meaning: 'ภาพลวงตา (Illusion)\nการหลอกลวง, หน้ากาก, การหักหลัง' },
                { id: 25, imageUrl: '25.png', title: '25. มนุษย์ยาง (Rubber Man)', meaning: 'ข้อจำกัด (Restriction)\nความอึดอัด, ความตึงเครียด, การถูกตีกรอบ' },
                { id: 26, imageUrl: '26.png', title: '26. หมวกเหล็ก (Helmet)', meaning: 'ความดื้อรั้น (Stubbornness)\nการปิดกั้น, อคติ, อีโก้' },
                { id: 27, imageUrl: '27.png', title: '27. สลัค (Half-Orc)', meaning: 'การไตร่ตรอง (Contemplation)\nสติปัญญา, ความช้าที่ชัวร์, คุณค่าภายใน' },
                { id: 28, imageUrl: '28.png', title: '28. Gemini (AI)', meaning: 'ตรรกะและเหตุผล (Logic & Reason)\nความจริงแท้, ความเป็นกลาง, การไร้อารมณ์' },
                { id: 29, imageUrl: '29.png', title: '29. ปึ๊ด (Resilience)', meaning: 'การฟื้นคืนพลัง (The Survivor)\nทรหด, มีสไตล์, ไม่ลืมตัว' },
                { id: 30, imageUrl: '30.png', title: '30. ลูกเสือ (The Scout)', meaning: 'สัจจะ (Integrity)\nเกียรติยศ, คำมั่นสัญญา, ความซื่อสัตย์' },
                { id: 31, imageUrl: '31.png', title: '31. นักวิจัย (The Researcher)', meaning: 'การหมกมุ่น (Obsession)\nการค้นหาความจริง, ความมุ่งมั่น, การวิเคราะห์' },
                { id: 32, imageUrl: '32.png', title: '32. โซค (The Scuba Diver)', meaning: 'การดำดิ่ง (Deep Exploration)\nโลกเฉพาะตัว, ความหลงใหล, คุณค่าที่ซ่อนอยู่' },
                { id: 33, imageUrl: '33.png', title: '33. นินจา (The Ninja)', meaning: 'ผู้ปิดทองหลังพระ (Unseen Duty)\nความลับ, การทำตามหน้าที่, การอยู่อย่างถ่อมตน' },
                { id: 34, imageUrl: '34.png', title: '34. เกษตรกร (The Farmer)', meaning: 'การอุทิศตน (Devotion)\nความเสียสละ, ผู้หล่อเลี้ยง, การสร้างรากฐาน' },
                { id: 35, imageUrl: '35.png', title: '35. ผู้คุมกฎ (The Enforcer)', meaning: 'วินัยและอำนาจ (Discipline & Authority)\nบทเรียนที่เข้มงวด, ความคาดหวัง, ผู้หวังดีในเงามืด' },
                { id: 36, imageUrl: '36.png', title: '36. ยมทูต (The Grim Reaper)', meaning: 'การสิ้นสุด (Transformation)\nการเริ่มต้นใหม่, การปล่อยวางสิ่งเก่า, การเปลี่ยนผ่าน' }

            ];
            
            for (let i = 11; i <= TOTAL_CARDS; i++) {
                allCardsData.push({
                    id: i,
                    imageUrl: `https://placehold.co/300x450/1e1b4b/e0e7ff?text=${i}&font=montserrat`,
                    title: `ไพ่ใบที่ ${i}`,
                    meaning: `ความหมายของไพ่ใบที่ ${i} (รอเพิ่มข้อมูล)`
                });
            }
            resetDeck();
        }

        function drawRandomCard() {
            if (availableDeck.length === 0) {
                document.getElementById('card-title').innerText = "ไพ่หมดสำรับแล้ว";
                document.getElementById('card-meaning').innerText = "กรุณากดปุ่ม 'เริ่มใหม่' เพื่อสับไพ่";
                document.getElementById('card-image').src = "https://placehold.co/300x450/3f3f46/ffffff?text=End";
                document.getElementById('next-draw-btn').classList.add('hidden');
                return;
            }
            const randomIndex = Math.floor(Math.random() * availableDeck.length);
            const drawnCard = availableDeck.splice(randomIndex, 1)[0];
            displayCard(drawnCard);
            updateRemainingCount();
        }

        function displayCard(card) {
            document.getElementById('start-area').classList.add('hidden');
            const resultArea = document.getElementById('result-area');
            resultArea.classList.remove('hidden');
            resultArea.classList.add('flex');
            document.getElementById('next-draw-btn').classList.remove('hidden');

            const cardDisplay = document.getElementById('card-display');
            cardDisplay.classList.remove('card-reveal');
            void cardDisplay.offsetWidth;
            cardDisplay.classList.add('card-reveal');

            document.getElementById('card-image').src = card.imageUrl;
            document.getElementById('card-title').innerText = card.title;
            document.getElementById('card-meaning').innerText = card.meaning;
        }

        function resetDeck() {
            availableDeck = [...allCardsData];
            updateRemainingCount();
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('flex');
            document.getElementById('start-area').classList.remove('hidden');
            document.getElementById('next-draw-btn').classList.add('hidden');
        }

        function updateRemainingCount() {
            document.getElementById('cards-remaining').innerText = availableDeck.length;
            if (availableDeck.length === 0) {
                document.getElementById('next-draw-btn').classList.add('hidden');
            }
        }

        window.onload = () => { initializeDeck(); };
    </script>
</body>
</html>
