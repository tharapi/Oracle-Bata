        function setupEmptySlots() {
            const cardsContainer = document.getElementById('cards-container');
            cardsContainer.innerHTML = '';
            for(let i=0; i<3; i++) {
                cardsContainer.innerHTML += `
                    <div id="slot-${i}" class="w-[90px] h-[135px] xs:w-28 xs:h-40 sm:w-36 sm:h-52 rounded-xl shadow-lg border-[2px] border-indigo-900/50 flex items-center justify-center shrink-0 transition-all duration-300 card-back-pattern opacity-60">
                        <span class="text-indigo-400/70 text-2xl font-bold">${i+1}</span>
                    </div>
                `;
            }
        }

        function drawSingleCard() {
            if (currentSpread.length === 3) {
                currentSpread = [];
                document.getElementById('meanings-container').innerHTML = '';
                setupEmptySlots();
            }

            const startArea = document.getElementById('start-area');
            if (!startArea.classList.contains('hidden')) {
                startArea.classList.add('hidden');
                startArea.classList.remove('flex');
                
                const resultArea = document.getElementById('result-area');
                resultArea.classList.remove('hidden');
                resultArea.classList.add('flex');
                
                setupEmptySlots();
                document.getElementById('meanings-container').innerHTML = '';
            }

            const randomIndex = Math.floor(Math.random() * availableDeck.length);
            const drawnCard = availableDeck.splice(randomIndex, 1)[0];
            const slotIndex = currentSpread.length; 
            currentSpread.push(drawnCard);

            const slot = document.getElementById(`slot-${slotIndex}`);
            slot.className = `card-reveal w-[90px] h-[135px] xs:w-28 xs:h-40 sm:w-36 sm:h-52 rounded-xl overflow-hidden shadow-xl shadow-indigo-900/50 bg-gray-800 border-[2px] border-indigo-400 shrink-0 cursor-pointer hover:scale-105 transition-transform duration-200`;
            
            // เพิ่ม onclick เพื่อเรียกฟังก์ชันซูมรูปภาพ (openModal)
            slot.innerHTML = `
                <img src="${drawnCard.imageUrl}" alt="ไพ่ ${slotIndex+1}" class="w-full h-full object-cover" 
                     onerror="this.onerror=null; this.src='https://placehold.co/300x450/1e1b4b/e0e7ff?text=Card+${slotIndex+1}&font=prompt';"
                     onclick="openModal('${drawnCard.imageUrl}', ${slotIndex+1})">
            `;

            const meaningsContainer = document.getElementById('meanings-container');
            meaningsContainer.innerHTML += `
                <div class="text-left bg-gray-900/80 backdrop-blur-md p-4 rounded-xl border border-gray-700 w-full shadow-lg card-reveal">
                    <span class="inline-block px-2 py-1 bg-indigo-900/50 text-indigo-300 text-xs rounded-md mb-2 font-medium border border-indigo-800/50">
                        ${spreadTitles[slotIndex]}
                    </span>
                    <h2 class="text-lg font-medium text-indigo-100 mb-1">${drawnCard.title}</h2>
                    <p class="text-gray-300 leading-relaxed whitespace-pre-line text-sm">${drawnCard.meaning}</p>
                </div>
            `;

            setTimeout(() => {
                const mainEl = document.getElementById('main-scroll');
                mainEl.scrollTo({ top: mainEl.scrollHeight, behavior: 'smooth' });
            }, 100);

            updateRemainingCount();
            updateNextButtonState();
        }

        // --- ฟังก์ชันสำหรับการซูมรูปภาพ (Modal) ---
        function openModal(imgUrl, index) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            
            modalImg.src = imgUrl;
            modalImg.onerror = function() {
                this.onerror = null;
                this.src = `https://placehold.co/600x900/1e1b4b/e0e7ff?text=Card+${index}+Not+Found&font=prompt`;
            };

            modal.classList.remove('hidden');
            // เพื่อให้เกิดอนิเมชัน fade-in และ zoom-in
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modalImg.classList.remove('scale-95');
            modalImg.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            
            modal.classList.add('opacity-0');
            modalImg.classList.remove('scale-100');
            modalImg.classList.add('scale-95');
            
            // รอให้อนิเมชันจบแล้วค่อยซ่อน element (ประมาณ 300ms ตามที่กำหนดใน class)
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
        // ----------------------------------------

        function updateNextButtonState() {
            const btn = document.getElementById('next-draw-btn');
            btn.classList.remove('hidden');
            
            const baseBtnClass = "w-full max-w-[300px] py-3 rounded-xl text-white font-medium shadow-lg transition-colors focus:outline-none text-base ";

            if (availableDeck.length === 0) {
                btn.innerText = "↺ ไพ่หมดสำรับ (เริ่มใหม่ทั้งหมด)";
                btn.className = baseBtnClass + "bg-gray-700 hover:bg-gray-600 active:bg-gray-800 border border-gray-500";
                btn.onclick = resetDeck;
                return;
            }

            btn.onclick = drawSingleCard;

            if (currentSpread.length === 1) {
                btn.innerText = "✨ เปิดไพ่ใบที่ 2 (ปัจจุบัน) ✨";
                btn.className = baseBtnClass + "bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700";
            } else if (currentSpread.length === 2) {
                btn.innerText = "✨ เปิดไพ่ใบที่ 3 (อนาคต) ✨";
                btn.className = baseBtnClass + "bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700";
            } else if (currentSpread.length === 3) {
                btn.innerText = "✨ เริ่มสุ่มชุดต่อไป (เคลียร์กระดาน) ✨";
                btn.className = baseBtnClass + "bg-purple-600 hover:bg-purple-500 active:bg-purple-700";
            }
        }

        function resetDeck() {
            availableDeck = [...allCardsData];
